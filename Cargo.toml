[dependencies]
quoin-core = { path = "../quoin/quoin-core", version = "0.1" }
thiserror = "2"
tracing = "0.1"
dashmap = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "rt", "macros", "test-util"] }
quoin-testkit = { path = "../quoin/quoin-testkit", version = "0.1", features = ["tokio"] }
pretty_assertions = "1"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
devtools = []

[lib]
name = "rs_query"
path = "src/lib.rs"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# `QueryOptions` and `QueryResultFlags` mirror TanStack Query's flat boolean
# option/result surfaces 1:1; regrouping fields would break API parity.
struct_excessive_bools = "allow"

[package]
authors = ["elcoosp"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
build = false
categories = ["asynchronous", "caching", "gui"]
description = "TanStack Query-inspired async state management, portable to every quoin-supported UI framework"
documentation = "https://docs.rs/rs-query"
edition = "2024"
exclude = ["docs/*", ".github/*", ".DS_Store"]
keywords = ["query", "async", "cache", "tanstack", "quoin"]
license = "MIT"
name = "rs-query"
readme = "README.md"
version = "0.2.0"
